<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Контрольний замір</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">ActiveTracker</a>
    <a class="btn btn-outline-light btn-sm" href="/">← Назад</a>
  </div>
</nav>

<div class="container" style="max-width: 600px;">

    <div class="card border-0 shadow-sm p-4 mb-3">
        <h4 class="mb-1">Контрольний замір</h4>
        <p class="text-muted">Раз в 2 тижні ми аналізуємо прогрес і при потребі коригуємо програму.</p>

        {% if prev_check %}
        <div class="alert alert-info py-2 mb-3" style="font-size:13px;">
            <strong>Попередній замір:</strong> {{ prev_check.date }} · {{ prev_check.weight }} кг
        </div>
        {% endif %}

        <form method="POST">
            <div class="row g-3 mb-3">
                <div class="col-12">
                    <label class="form-label fw-semibold">Поточна вага (кг) <span class="text-danger">*</span></label>
                    <input type="number" name="weight" step="0.1" class="form-control" placeholder="70.5" required>
                </div>
            </div>

            <p class="fw-semibold mb-2">Заміри тіла (необов'язково):</p>
            <div class="row g-3 mb-4">
                <div class="col-4">
                    <label class="form-label text-muted" style="font-size:13px;">Талія (см)</label>
                    <input type="number" name="waist_cm" step="0.5" class="form-control">
                </div>
                <div class="col-4">
                    <label class="form-label text-muted" style="font-size:13px;">Груди (см)</label>
                    <input type="number" name="chest_cm" step="0.5" class="form-control">
                </div>
                <div class="col-4">
                    <label class="form-label text-muted" style="font-size:13px;">Стегна (см)</label>
                    <input type="number" name="hips_cm" step="0.5" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Середній рівень енергії за 2 тижні</label>
                <select name="avg_energy" class="form-select">
                    <option value="1">1 — Дуже низький </option>
                    <option value="2">2 — Низький </option>
                    <option value="3" selected>3 — Середній </option>
                    <option value="4">4 — Високий </option>
                    <option value="5">5 — Відмінний </option>
                </select>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-6">
                    <label class="form-label fw-semibold">Виконано тренувань</label>
                    <input type="number" name="workouts_completed" class="form-control"
                           value="{{ recent_workouts }}" min="0">
                </div>
                <div class="col-6">
                    <label class="form-label fw-semibold">Заплановано було</label>
                    <input type="number" name="workouts_planned" class="form-control"
                           value="{{ planned }}" min="0">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Аналізувати прогрес →</button>
        </form>
    </div>
</div>
</body>
</html>
