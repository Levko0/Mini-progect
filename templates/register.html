<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8"><title>Реєстрація — ActiveTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f6f9; display:flex; align-items:center; justify-content:center; min-height:100vh;">
<div class="card shadow p-4" style="width:420px;">
    <h4 class="fw-bold mb-1">Реєстрація</h4>
    <p class="text-muted mb-4">Створіть акаунт і отримайте план</p>
    <div id="alert" class="alert d-none"></div>
    <input id="username" class="form-control mb-2" placeholder="Ім'я">
    <input id="email" type="email" class="form-control mb-2" placeholder="Email">
    <input id="password" type="password" class="form-control mb-3" placeholder="Пароль">
    <hr><p class="fw-bold mb-2">Ваші параметри</p>
    <div class="row g-2 mb-2">
        <div class="col"><input id="weight" type="number" class="form-control" placeholder="Вага (кг)"></div>
        <div class="col"><input id="height" type="number" class="form-control" placeholder="Зріст (см)"></div>
    </div>
    <div class="row g-2 mb-2">
        <div class="col"><input id="age" type="number" class="form-control" placeholder="Вік"></div>
        <div class="col">
            <select id="gender" class="form-select">
                <option value="male">Чоловік</option>
                <option value="female">Жінка</option>
            </select>
        </div>
    </div>
    <select id="goal" class="form-select mb-2">
        <option value="loss">Схуднення</option>
        <option value="gain">Набір маси</option>
        <option value="maintenance">Підтримка</option>
    </select>
    <select id="pal" class="form-select mb-3">
        <option value="1.2">Малоактивний</option>
        <option value="1.375">Легка активність</option>
        <option value="1.55">Помірна активність</option>
        <option value="1.725">Дуже активний</option>
    </select>
    <button class="btn btn-primary w-100 mb-2" onclick="register()">Зареєструватись</button>
    <a href="/login" class="btn btn-outline-secondary w-100">Вже є акаунт</a>
</div>
<script>
async function register() {
    const res = await fetch('/api/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: document.getElementById('username').value,
                              email: document.getElementById('email').value,
                              password: document.getElementById('password').value})
    });
    const data = await res.json();
    const alert = document.getElementById('alert');
    if (!res.ok) {
        alert.className = 'alert alert-danger';
        alert.textContent = data.error;
        alert.classList.remove('d-none'); return;
    }
    await fetch('/api/profile/measurements', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            weight: +document.getElementById('weight').value,
            height: +document.getElementById('height').value,
            age: +document.getElementById('age').value,
            gender: document.getElementById('gender').value,
            goal: document.getElementById('goal').value,
            activity_level: +document.getElementById('pal').value
        })
    });
    window.location.href = '/';
}
</script>
</body></html>
"""
