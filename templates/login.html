<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8"><title>Вхід — ActiveTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f6f9; display:flex; align-items:center; justify-content:center; min-height:100vh;">
<div class="card shadow p-4" style="width:380px;">
    <h4 class="fw-bold mb-1">ActiveTracker</h4>
    <p class="text-muted mb-4">Увійдіть у свій акаунт</p>
    <div id="alert" class="alert alert-danger d-none"></div>
    <input id="email" type="email" class="form-control mb-2" placeholder="Email">
    <input id="password" type="password" class="form-control mb-3" placeholder="Пароль">
    <button class="btn btn-primary w-100 mb-2" onclick="login()">Увійти</button>
    <a href="/register" class="btn btn-outline-secondary w-100">Зареєструватись</a>
</div>
<script>
async function login() {
    const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: document.getElementById('email').value,
                              password: document.getElementById('password').value})
    });
    const data = await res.json();
    if (res.ok) window.location.href = '/';
    else {
        document.getElementById('alert').classList.remove('d-none');
        document.getElementById('alert').textContent = data.error;
    }
}
</script>
</body></html>
